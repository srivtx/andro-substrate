[package]
name = "dexcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "DEX container reader, Dalvik bytecode decoder, DEX writer/assembler and Android binary XML parser for andro-substrate"
license = "Apache-2.0"
publish = false

[lib]
name = "dexcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
